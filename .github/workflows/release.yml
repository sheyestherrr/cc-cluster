# 发布：推 v* 标签出一个版本；带 - 的（v0.1.0-alpha.1、v1.0.0-rc.1）标成预发布。
# Release 的说明取自 CHANGELOG.md 里这个版本的那一段，没有这一段就不发布。
#
# 三个任务权限分开：
#   build   只有读权限：跑检查、装前端依赖并构建（这一步会执行第三方包的代码），产出发布包。
#   image   只多一个推镜像的权限：构建网关镜像和 worker 镜像并推到 GHCR。
#   publish 只多一个写 Release 的权限：不检出代码、不执行仓库里的任何东西，只上传 build 的产物。
#
# 其余约定同 ci.yml：Action 按提交哈希固定，标签名等外部输入经环境变量传入并先校验。
name: 发布

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.21.0"

jobs:
  build:
    name: 检查并打包
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image_tags: ${{ steps.meta.outputs.image_tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 确定版本
        id: meta
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != tag ] || ! printf '%s' "${version}" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "标签 ${version} 不符合 v主.次.修订[-预发布] 格式，已取消发布" >&2
            exit 1
          fi
          case "${version}" in
            *-*) prerelease=true; image_tags="${version}" ;;
            *) prerelease=false; image_tags="${version} latest" ;;
          esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "image_tags=${image_tags}"
          } >> "${GITHUB_OUTPUT}"
      - name: 提取该版本的更新记录
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          sh scripts/ci/release-notes.sh "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          # 发布包不从缓存里取任何东西
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: 安装 pnpm
        run: npm install --global "pnpm@${PNPM_VERSION}"
      - name: 发布前检查
        run: |
          go mod verify
          make check
      - name: 构建各平台发布包并生成校验和
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          make dist VERSION="${VERSION}"
          cp "${RUNNER_TEMP}/notes.md" dist/RELEASE_NOTES.md
          ls -l dist
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: ${{ matrix.title }}镜像
    needs: build
    runs-on: ubuntu-24.04
    # worker 镜像的 arm64 一份要在模拟器里装一遍软件包，比网关镜像慢得多。
    timeout-minutes: 60
    strategy:
      # 两个镜像互不依赖：一个失败不要把另一个推到一半时取消。
      fail-fast: false
      matrix:
        include:
          - name: gateway
            title: 网关
          # 不传 TMUX_VERSION：镜像里只有发行版自带的 tmux。
          # 要用宿主 tmux 桥接、而宿主的 tmux 是别的版本时，由使用者在本机 make image-worker。
          - name: worker
            title: worker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: 构建并推送到 GHCR（amd64 与 arm64）
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
          NAME: ${{ matrix.name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cc-cluster-${NAME}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --use --name release
          read -r -a names <<< "${IMAGE_TAGS}"
          tags=()
          for t in "${names[@]}"; do
            tags+=(--tag "${image}:${t}")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            "${tags[@]}" \
            --push \
            "images/${NAME}"

  publish:
    name: 发布 Release
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: 验证校验和
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cc-cluster-gateway"
          worker="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cc-cluster-worker"
          notes="${RUNNER_TEMP}/notes.md"
          {
            cat dist/RELEASE_NOTES.md
            echo
            echo "---"
            echo
            echo "网关镜像 / Gateway image：\`${image}:${VERSION}\`"
            echo
            echo "worker 镜像 / Worker image：\`${worker}:${VERSION}\`"
            echo
            echo "下载后可用 \`sha256sum --check SHA256SUMS\` 校验。 / Verify downloads with \`sha256sum --check SHA256SUMS\`."
          } > "${notes}"
          if gh release view "${VERSION}" > /dev/null 2>&1; then
            # 同一个标签重跑：只补传文件，不动已经写好的说明。
            gh release upload "${VERSION}" dist/*.tar.gz dist/SHA256SUMS --clobber
            exit 0
          fi
          flags=(--verify-tag --title "${VERSION}" --notes-file "${notes}")
          if [ "${PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${VERSION}" dist/*.tar.gz dist/SHA256SUMS "${flags[@]}"
