# 日常检查：推到 dev / master 和提 PR 时运行。
#
# 约定：
#   - 第三方 Action 一律按提交哈希固定，行尾注明对应的版本；更新由 Dependabot 提 PR。
#   - 默认只有读权限，这个工作流里没有任何任务需要写权限。
#   - 不使用 pull_request_target：来自 fork 的 PR 拿不到任何密钥。
#   - 下载的工具固定版本并核对 SHA-256。
name: 检查

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.21.0"

jobs:
  go:
    name: Go 检查（${{ matrix.go }}）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.mod 声明的最低版本，和当前的稳定版（发布包用它构建）。
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: 核对依赖与 go.sum 一致
        run: go mod verify
      - name: vet、gofmt 与单元测试
        run: make check

  build:
    name: 网页与二进制
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: 安装 pnpm
        run: npm install --global "pnpm@${PNPM_VERSION}"
      - name: 构建带网页界面的二进制（含前端的类型检查）
        run: make release VERSION="ci-${GITHUB_SHA::7}"
      - name: 运行一下
        run: ./bin/cc-cluster version
      - name: 前端依赖的已知漏洞（只提示）
        continue-on-error: true
        run: pnpm --dir web audit --prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc-cluster-linux-amd64
          path: bin/cc-cluster
          if-no-files-found: error
          retention-days: 14

  secrets:
    name: 凭据与仓库卫生
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 本项目的规则（路径、订阅地址、带密码的代理地址），连历史一起查
        run: sh scripts/ci/check-repo.sh --history
      - name: 安装 gitleaks
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
      - name: gitleaks 扫描全部历史（日志里不显示查到的内容）
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --log-opts="--all" .

  vuln:
    name: Go 依赖的已知漏洞
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOVULNCHECK_VERSION: v1.10.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" ./...

  workflows:
    name: 工作流自查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  e2e:
    name: 端到端测试（假节点）
    # 日常推到 dev 时不跑；master、PR 和手动触发时跑。
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # 先不拦合并：这组测试要 NET_ADMIN 和 TUN 设备，在 GitHub 的机器上还没有稳定跑通过。
    # 连续通过几次之后去掉这一行。
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: 准备宿主：tmux（桥接一组要用，镜像按它的版本编译）与 TUN 设备
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux
          sudo modprobe tun || true
          test -c /dev/net/tun
          tmux -V
          docker version
      - name: 构建网关与 worker 镜像
        run: make images
      - name: 端到端测试（只用 internal 网络和假节点，不访问外部地址）
        run: make e2e
